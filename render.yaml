services:
  - type: web
    name: goldenswan-hotel
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.11.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: goldenswan_hotel
      - key: HOTEL_TIMEZONE
        value: Asia/Kolkata
      - key: JWT_ACCESS_TOKEN_LIFETIME_MINUTES
        value: "1440"
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"

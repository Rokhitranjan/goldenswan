services:
  - type: web
    name: goldenswan-hotel
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: goldenswan_hotel
      - key: HOTEL_TIMEZONE
        value: Asia/Kolkata
      - key: JWT_ACCESS_TOKEN_LIFETIME_MINUTES
        value: "1440"
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"
